# --- 共通定義 (YAML Anchors) ---

# 全サービス共通のビルド設定
x-app: &app
  build:
    dockerfile: Dockerfile.dev
    context: .
    args:
      RUBY_VERSION: '4.0.2'
      DISTRO_NAME: bookworm
      # ホストのユーザーIDを反映し、パーミッション問題を解決
      USER_UID: ${HOST_UID:-1000}
      USER_GID: ${HOST_GID:-1000}
  image: dockered_dev-dev:1.0.0
  # OS の /tmp をメモリ上に置く (gem ビルドの中間ファイル等が速くなる。Rails の tmp は /app/tmp 側)
  tmpfs:
    - /tmp

# Railsを動かすコンテナ共通の実行設定
x-backend: &backend
  <<: *app
  stdin_open: true # デバッグ(rdbg等)で標準入力を開けておく
  tty: true        # ログの色付けや対話型シェルを有効化
  volumes:
    - .:/app:cached               # ソースコード (cachedでmacOS等の同期を高速化)
    - bundle:/usr/local/bundle    # インストールしたGemを永続化
    - rails_cache:/app/tmp/cache  # Rails の tmp/cache を永続化 (bootsnap は BOOTSNAP_CACHE_DIR 側)
    - history:/usr/local/hist     # シェルの履歴をコンテナを壊しても残す
  environment:
    RAILS_ENV: ${RAILS_ENV:-development}
    NODE_ENV: ${NODE_ENV:-development}
    HISTFILE: /usr/local/hist/.bash_history # 履歴保存先を指定
    BUNDLE_PATH: /usr/local/bundle
    BOOTSNAP_CACHE_DIR: /usr/local/bundle/_bootsnap # キャッシュもボリューム内に
    DB_HOST: db # database.ymlと対応

services:
  # 1. サーバー実行用サービス (ブラウザからアクセスするメイン)
  app:
    <<: *backend
    command: bin/rails server -b 0.0.0.0
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy # DBが完全に起動してから起動
      setup:
        condition: service_completed_successfully # セットアップが正常終了してから起動

  # 2. 初期セットアップ専用サービス (bundle install / migrate を自動化)
  setup:
    <<: *backend
    command: bin/setup --skip-server
    depends_on:
      db:
        condition: service_healthy

  # 3. 開発用シェル / デバッグ用サービス (常駐コンテナ)
  # profiles指定により、明示的に指定しない限り up では起動しない
  runner:
    <<: *backend
    command: sleep infinity
    profiles: ['tools']

  # 4. データベースサービス
  db:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'true' # 開発用なのでパスワード空
    ports:
      - '3306:3306' # ホストのクライアントツールからも接続可能にする
    healthcheck:
      # DBがクエリを受け付けられる状態かを判定
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bundle:      # Gem用
  mysql_data:  # DBデータ用
  rails_cache: # キャッシュ用
  history:     # シェル履歴用
